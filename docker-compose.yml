# n8n + PostgreSQL behind Nginx with automatic Let's Encrypt certificates.
#
# Every value comes from .env (copy .env.example). Secrets are left empty in the
# example on purpose: the `:?` checks below make `docker compose` refuse to start
# until they are filled in, instead of starting with a placeholder password.
#
# Only nginx publishes ports. Docker writes its own iptables rules, so a published
# port is reachable from the internet even when ufw says it is closed.

name: n8n-stack

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  # Docker's default json-file driver never rotates. Without this, container logs
  # are one of the ways a small VPS disk fills up.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *defaults
    # Major version pinned on purpose: a major upgrade is a dump + restore, not a tag
    # change (see README, "Upgrading"). Minor/patch updates arrive with `docker compose pull`.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      TZ: ${TIMEZONE:-Europe/Paris}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    shm_size: 128m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-1g}

  n8n:
    <<: *defaults
    # n8n publishes no floating major tag, so the full version is pinned in .env.
    # `latest` would silently jump to the next major on a routine pull.
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?set N8N_VERSION in .env}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Encrypts every credential stored in the database. Lose it and a restored
      # database is useless; keep a copy outside this server.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_HOST:?set N8N_HOST in .env}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      # Public base URL for webhooks. WEBHOOK_URL is deprecated since n8n 2.35.
      N8N_WEBHOOK_URL: https://${N8N_HOST}/
      # Exactly one proxy (nginx) sits in front: trust one X-Forwarded-For hop, no more.
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: ${TIMEZONE:-Europe/Paris}
      TZ: ${TIMEZONE:-Europe/Paris}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      # Code nodes and expressions cannot read process env (which holds the DB password).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-true}
      # Blocks HTTP Request nodes from reaching private ranges and cloud metadata
      # endpoints. If a workflow must call an internal host, add
      # N8N_SSRF_ALLOWED_HOSTNAMES (or N8N_SSRF_ALLOWED_IP_RANGES) here.
      N8N_SSRF_PROTECTION_ENABLED: ${N8N_SSRF_PROTECTION_ENABLED:-true}
      # Execution history is the usual reason an n8n database keeps growing.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-10000}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - edge
      - backend
    cap_drop:
      - ALL
    # n8n waits for running executions on SIGTERM; Docker's default 10 s cuts them off.
    stop_grace_period: 45s
    healthcheck:
      # /healthz/readiness is 200 only when the database is connected and migrated.
      # Uses node because it is the one tool guaranteed to exist in the n8n image.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5678/healthz/readiness', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${N8N_MEM_LIMIT:-2g}

  nginx:
    <<: *defaults
    image: nginx:1.30-alpine
    init: true
    # nginx/start.sh renders the config for the current certificate state and
    # reloads nginx when certbot writes a new certificate. No Docker socket involved.
    command: ["/bin/sh", "/opt/nginx/start.sh"]
    environment:
      N8N_HOST: ${N8N_HOST:?set N8N_HOST in .env}
      NGINX_CERT_POLL_SECONDS: "60"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/start.sh:/opt/nginx/start.sh:ro
      - ./nginx/templates:/opt/nginx/templates:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - edge
    # No depends_on n8n: nginx must keep answering ACME challenges even when n8n is
    # down, and it resolves the n8n container at request time, not at startup.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  certbot:
    <<: *defaults
    image: certbot/certbot:${CERTBOT_VERSION:-v5.8.0}
    init: true
    # Obtains the certificate on first start, then checks twice a day and renews when due.
    entrypoint: ["/bin/sh", "/opt/certbot/loop.sh"]
    environment:
      N8N_HOST: ${N8N_HOST:?set N8N_HOST in .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-0}
    volumes:
      - ./certbot/loop.sh:/opt/certbot/loop.sh:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - edge
    depends_on:
      nginx:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

  # Not started by `docker compose up` (profile). backup.sh and restore.sh use it to
  # read and write the n8n data volume, so they never depend on which tools happen
  # to ship inside the n8n image.
  volume-tools:
    image: alpine:3.24
    profiles: ["tools"]
    network_mode: none
    volumes:
      - n8n_data:/data/n8n

networks:
  # nginx <-> n8n, plus outbound internet for n8n and certbot.
  edge: {}
  # n8n <-> postgres only. internal: no route to the outside world, no published ports.
  backend:
    internal: true

volumes:
  postgres_data:
  n8n_data:
  certbot_conf:
  certbot_www:
